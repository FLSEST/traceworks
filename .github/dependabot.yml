# Dependabot: pull requests for what it can read, once a week for Maven and the actions, every day for the base
# images, so that a security fix of an image arrives within a day.
#
# It reads the POMs, the actions of .github/workflows and the FROM lines of the Dockerfiles. It does not read a
# version inside a RUN line (the AI CLIs that the images claude and pi install with npm) or inside a script (PIT in
# examples/mutation-testing/scripts/pit.sh): the build audit in examples/self-audit/build looks those up.
#
# The groups decide what is merged without a reader (.github/workflows/dependabot-auto-merge.yml): a pull request of
# the groups build-plugins, actions and images holds patch and minor updates only and is merged once the required
# checks pass. Everything else stays a pull request for a person: Jackson, the one library in the jar; the test
# libraries; and every major update, which no group takes and which comes alone.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      build-plugins:
        patterns: ["org.apache.maven.plugins:*"]
        update-types: [minor, patch]
      test-libraries:
        patterns: ["org.junit*", "org.assertj:*", "org.mockito:*", "net.bytebuddy:*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /images/*
      - /examples/**/images/*
      - /integration-tests/fake-ai/*
      - /integration-tests/packages/*/images/*
    schedule:
      interval: daily
    groups:
      images:
        patterns: ["*"]
        update-types: [minor, patch]
    # No pull request for a new major version of a base image: Java 21 to 26, Node 22 to 24 or a new Debian is a
    # decision, made by hand. What stays is a new digest of the same tag, which is how a security fix arrives, and a
    # minor or patch version.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
