# Dependabot: one pull request a week per group, for what it can read.
#
# It reads the POMs, the actions of .github/workflows and the FROM lines of the Dockerfiles. It does not read a
# version inside a RUN line (the AI CLIs that the images claude and pi install with npm) or inside a script (PIT in
# examples/mutation-testing/scripts/pit.sh): the build audit in examples/self-audit/build looks those up.
#
# cooldown: a release is proposed once it is two weeks old, so a release that is withdrawn in its first days never
# reaches a pull request. Security updates are not held back by it.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /images/*
      - /examples/**/images/*
      - /integration-tests/fake-ai/*
      - /integration-tests/packages/*/images/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]
