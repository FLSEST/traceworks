<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 764" role="img" aria-labelledby="t d">
  <title id="t">The home of Traceworks: one ledger, a record per run, a register per workflow key and project</title>
  <desc id="d">On the left the operator, who starts a run of a package with a project key, the package, the project's workspace and a person who decides on findings. In the middle the record of the run: plain files with a hash chain from run.started to run.finished, blobs, the manifest and run.html. On the right the ledger, the one git repository of the home, with a start entry, an end entry, acknowledgements and the anchors of each register per key and project. Below, the registers of one workflow key with a compartment per project, each a log with a hash chain, blobs and derived files. Arrows: the hash of line 0 goes to the ledger before the first step, the manifest with the head when the run ends, the report of an audit run into the register of the run's project, the known findings back to the next run of that project only, a person's decision into the register, and after every write of a register an anchor into the ledger that says the sequence number, the head, what was written and by whom.</desc>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; fill: #33454d; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .title { font-size: 19px; font-weight: 700; } .sub { font-size: 13px; } .h { font-size: 16px; font-weight: 650; }
    .bh { font-size: 14px; font-weight: 600; } .foot { font-size: 13.5px; } .lead { font-weight: 700; }
    .ink { fill: #14232b; } .soft { fill: #33454d; } .muted { fill: #5a6a72; } .teal { fill: #0b7a75; }
    .card { fill: #ffffff; stroke: #14232b; stroke-width: 1.8; } .tint { fill: #e6f1f0; stroke: #14232b; stroke-width: 1.6; }
    .chip { fill: #eef2f3; stroke: #c5d0d3; stroke-width: 1; } .band { fill: #eef2f3; }
    .deep { fill: #14232b; stroke: #14232b; stroke-width: 1.8; } .ondeep { fill: #e9f0f1; } .ondeep2 { fill: #c9d6d9; }
    .dchip { fill: #213540; stroke: #3d535c; stroke-width: 1; }
    .line { fill: none; stroke: #14232b; stroke-width: 1.8; } .tline { fill: none; stroke: #0b7a75; stroke-width: 1.8; }
    .link { fill: none; stroke: #5a6a72; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      text, .soft { fill: #b9c7cc; } .ink { fill: #e9f0f1; } .muted { fill: #94a5ac; } .teal { fill: #45c9bd; }
      .card { fill: #152126; stroke: #b9c7cc; } .tint { fill: #1b2d33; stroke: #b9c7cc; }
      .chip { fill: #1f2e34; stroke: #3a4d54; } .band { fill: #1b272c; }
      .deep { fill: #e9f0f1; stroke: #e9f0f1; } .ondeep { fill: #14232b; } .ondeep2 { fill: #33454d; }
      .dchip { fill: #ffffff; stroke: #b9c7cc; }
      .line { stroke: #e9f0f1; } .tline { stroke: #45c9bd; } .link { stroke: #94a5ac; }
    }
  </style>
  <text class="title ink" x="20" y="34">A home: run records, one ledger, and registers</text>
  <text class="sub muted" x="20" y="54">Run records and registers are plain files with a hash chain, no git; the ledger holds the head of each log and what its anchors say.</text>

  <!-- left column: who and what goes into a run -->
  <rect class="card" x="20" y="76" width="206" height="82" rx="10"/>
  <text class="bh ink" x="34" y="102">Operator</text>
  <text class="mono ink" x="34" y="122">traceworks run &lt;package&gt;</text>
  <text class="mono ink" x="34" y="140">--project shop</text>
  <rect class="card" x="20" y="178" width="206" height="82" rx="10"/>
  <text class="bh ink" x="34" y="204">Package</text>
  <text class="mono ink" x="34" y="224">workflow.json, scripts,</text>
  <text class="mono ink" x="34" y="242">catalog.json</text>
  <rect class="card" x="20" y="280" width="206" height="64" rx="10"/>
  <text class="bh ink" x="34" y="306">Project “shop”</text>
  <text class="muted" x="34" y="326">the workspace of the run</text>
  <rect class="card" x="20" y="542" width="206" height="64" rx="10"/>
  <text class="bh ink" x="34" y="568">Person</text>
  <text class="mono ink" x="34" y="588">findings accept|dismiss</text>

  <!-- the record of the run -->
  <rect class="card" x="330" y="76" width="272" height="312" rx="14"/>
  <text class="h ink" x="346" y="104">Run record</text>
  <text class="muted" x="586" y="104" text-anchor="end">plain files, no git</text>
  <text class="mono muted" x="346" y="124">runs/&lt;date&gt;/&lt;run-id&gt;/</text>
  <rect class="chip" x="346" y="136" width="240" height="26" rx="6"/>
  <text class="mono ink" x="356" y="153.5">0  run.started</text>
  <path class="link" d="M366 162V170"/>
  <rect class="chip" x="346" y="170" width="240" height="26" rx="6"/>
  <text class="mono ink" x="356" y="187.5">1  step.started</text>
  <path class="link" d="M366 196V204"/>
  <rect class="chip" x="346" y="204" width="240" height="26" rx="6"/>
  <text class="mono muted" x="356" y="221.5">…  hash of the line before</text>
  <path class="link" d="M366 230V238"/>
  <rect class="chip" x="346" y="238" width="240" height="26" rx="6"/>
  <text class="mono ink" x="356" y="255.5">n  run.finished</text>
  <rect class="chip" x="346" y="278" width="240" height="26" rx="6"/>
  <text class="mono ink" x="356" y="295.5">blobs/</text>
  <text class="muted" x="576" y="295.5" text-anchor="end">inputs and outputs</text>
  <rect class="chip" x="346" y="312" width="240" height="26" rx="6"/>
  <text class="mono ink" x="356" y="329.5">manifest.json</text>
  <rect class="chip" x="346" y="346" width="240" height="26" rx="6"/>
  <text class="mono ink" x="356" y="363.5">run.html</text>
  <text class="muted" x="576" y="363.5" text-anchor="end">the view</text>

  <!-- the ledger -->
  <rect class="deep" x="760" y="76" width="300" height="204" rx="14"/>
  <text class="h ondeep" x="776" y="104">Ledger</text>
  <text class="ondeep2" x="1044" y="104" text-anchor="end">the one git repository</text>
  <text class="ondeep2" x="776" y="124"><tspan class="mono">ledger/</tspan><tspan> · one per home, a commit per write</tspan></text>
  <rect class="dchip" x="776" y="136" width="268" height="26" rx="6"/>
  <text class="mono ondeep" x="786" y="153.5">starts/&lt;run-id&gt;.json</text>
  <text class="ondeep2" x="1034" y="153.5" text-anchor="end">project, starter</text>
  <rect class="dchip" x="776" y="170" width="268" height="26" rx="6"/>
  <text class="mono ondeep" x="786" y="187.5">runs/&lt;run-id&gt;.json</text>
  <text class="ondeep2" x="1034" y="187.5" text-anchor="end">the manifest</text>
  <rect class="dchip" x="776" y="204" width="268" height="26" rx="6"/>
  <text class="mono ondeep" x="786" y="221.5">acks/&lt;run-id&gt;.jsonl</text>
  <text class="ondeep2" x="1034" y="221.5" text-anchor="end">a person's note</text>
  <rect class="dchip" x="776" y="238" width="268" height="26" rx="6"/>
  <text class="mono ondeep" x="786" y="255.5">anchors/&lt;key&gt;/&lt;project&gt;.jsonl</text>

  <!-- the registers of one workflow key -->
  <rect class="card" x="330" y="470" width="730" height="218" rx="14"/>
  <text class="h ink" x="346" y="498">Registers</text>
  <text class="mono muted" x="346" y="516">registers/security/</text>
  <rect class="tint" x="346" y="526" width="341" height="146" rx="10"/>
  <text class="bh ink" x="360" y="552">Project shop</text>
  <text class="mono ink" x="673" y="552" text-anchor="end">shop/</text>
  <rect class="chip" x="360" y="564" width="313" height="26" rx="6"/>
  <text class="mono ink" x="370" y="581.5">events.jsonl</text>
  <text class="muted" x="663" y="581.5" text-anchor="end">hash chain</text>
  <rect class="chip" x="360" y="598" width="313" height="26" rx="6"/>
  <text class="mono ink" x="370" y="615.5">blobs/</text>
  <text class="muted" x="663" y="615.5" text-anchor="end">reports, findings</text>
  <rect class="chip" x="360" y="632" width="313" height="26" rx="6"/>
  <text class="mono ink" x="370" y="649.5">state.json, report.html</text>
  <text class="muted" x="663" y="649.5" text-anchor="end">derived</text>
  <rect class="tint" x="703" y="526" width="341" height="146" rx="10"/>
  <text class="bh ink" x="717" y="552">Project portal</text>
  <text class="mono ink" x="1030" y="552" text-anchor="end">portal/</text>
  <rect class="chip" x="717" y="564" width="313" height="26" rx="6"/>
  <text class="mono muted" x="727" y="581.5">events.jsonl</text>
  <rect class="chip" x="717" y="598" width="313" height="26" rx="6"/>
  <text class="mono muted" x="727" y="615.5">blobs/</text>
  <rect class="chip" x="717" y="632" width="313" height="26" rx="6"/>
  <text class="mono muted" x="727" y="649.5">state.json, report.html</text>

  <!-- arrows into the run -->
  <path class="line" d="M226 117H328"/>
  <path class="ink" d="M330 117L319 111.5L319 122.5z"/>
  <text class="muted" x="278" y="109" text-anchor="middle">starts</text>
  <path class="line" d="M226 219H328"/>
  <path class="ink" d="M330 219L319 213.5L319 224.5z"/>
  <text class="muted" x="278" y="211" text-anchor="middle">package digest</text>
  <path class="line" d="M226 312H328"/>
  <path class="ink" d="M330 312L319 306.5L319 317.5z"/>
  <text class="muted" x="278" y="304" text-anchor="middle">workspace</text>

  <!-- arrows from the run to the ledger -->
  <path class="line" d="M586 149H758"/>
  <path class="ink" d="M760 149L749 143.5L749 154.5z"/>
  <text x="681" y="141" text-anchor="middle">hash of line 0</text>
  <text class="muted" x="681" y="167" text-anchor="middle">before the first step</text>
  <path class="line" d="M586 325H681V183H758"/>
  <path class="ink" d="M760 183L749 177.5L749 188.5z"/>
  <text x="681" y="345" text-anchor="middle">manifest with the head</text>
  <text class="muted" x="681" y="361" text-anchor="middle">when the run ends</text>

  <!-- arrows between the run and the register of its project -->
  <path class="tline" d="M520 388V524"/>
  <path class="teal" d="M520 526L514.5 515L525.5 515z"/>
  <text class="teal" x="510" y="410" text-anchor="end">report with findings</text>
  <text class="muted" x="510" y="426" text-anchor="end">audit runs only</text>
  <path class="tline" d="M560 526V390"/>
  <path class="teal" d="M560 388L554.5 399L565.5 399z"/>
  <text class="teal" x="570" y="410">known findings, last report</text>
  <text class="muted" x="570" y="426">of its own project only</text>

  <!-- a person's decision -->
  <path class="line" d="M226 577H344"/>
  <path class="ink" d="M346 577L335 571.5L335 582.5z"/>
  <text class="muted" x="278" y="569" text-anchor="middle">decision</text>

  <!-- the anchors -->
  <path class="line" d="M660 526V448H880V282"/>
  <path class="ink" d="M880 280L874.5 291L885.5 291z"/>
  <path class="line" d="M930 526V282"/>
  <path class="ink" d="M930 280L924.5 291L935.5 291z"/>
  <text x="942" y="310">anchor:</text>
  <text x="942" y="326">seq and head,</text>
  <text x="942" y="342">what was written</text>
  <text x="942" y="358">and by whom</text>
  <text class="muted" x="942" y="378">after every write</text>

  <!-- the foot -->
  <rect class="band" x="20" y="704" width="1040" height="44" rx="12"/>
  <text class="foot ink" x="36" y="731"><tspan class="lead">One register per workflow key and project:</tspan><tspan dx="7">here the key “security”, with two projects.</tspan></text>
</svg>
